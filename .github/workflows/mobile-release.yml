name: Mobile release

# Builds signed store binaries and (when credentials exist) uploads them:
#   Android → signed AAB → Google Play track (default: closed testing)
#   iOS     → signed IPA → TestFlight
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v1.0.0.
# Secrets are documented in STORE.md. Missing secrets skip that platform with a notice.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which apps to build
        type: choice
        options: [both, android, ios]
        default: both
      version:
        description: Version shown in the stores (e.g. 1.0.0)
        default: '1.0.0'
      play_track:
        description: Google Play track
        type: choice
        options: [alpha, internal, beta, production]
        default: alpha
      upload_metadata:
        description: Also upload store texts and screenshots
        type: boolean
        default: false
  push:
    tags: ['v*']

env:
  # Store build numbers must always increase; the 0 suffix leaves room for manual uploads.
  BUILD_NUMBER: ${{ github.run_number }}0

jobs:
  android:
    if: ${{ !inputs.platform || inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION_NAME=${v:-1.0.0}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
      - name: Check credentials
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — skipping the signed Android build (see STORE.md)."
          fi
      - uses: actions/setup-node@v4
        if: env.KEYSTORE_B64 != ''
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: env.KEYSTORE_B64 != ''
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build web app and sync
        if: env.KEYSTORE_B64 != ''
        run: npm ci && npm run build:native && npx cap sync android
      - name: Build signed AAB
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ env.BUILD_NUMBER }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew bundleRelease --no-daemon
          rm -f "$ANDROID_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - uses: ruby/setup-ruby@v1
        if: env.KEYSTORE_B64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Upload to Google Play
        if: env.KEYSTORE_B64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        env:
          AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
          PLAY_TRACK: ${{ inputs.play_track || 'alpha' }}
        run: bundle exec fastlane android upload
      - name: Upload Play Store listing
        if: env.PLAY_SERVICE_ACCOUNT_JSON != '' && inputs.upload_metadata
        run: bundle exec fastlane android metadata

  ios:
    if: ${{ !inputs.platform || inputs.platform != 'android' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION_NAME=${v:-1.0.0}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
      - name: Check credentials
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::App Store Connect secrets are not set — skipping the iOS release (see STORE.md)."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 22
          cache: npm
      - name: Build web app and sync
        if: env.SKIP != '1'
        run: npm ci && npm run build:native && npx cap sync ios
      - uses: ruby/setup-ruby@v1
        if: env.SKIP != '1'
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build, sign and upload to TestFlight
        if: env.SKIP != '1'
        run: bundle exec fastlane ios beta
      - name: Upload App Store listing
        if: env.SKIP != '1' && inputs.upload_metadata
        run: bundle exec fastlane ios metadata
      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1'
        with:
          name: ios-ipa
          path: build/ios/*.ipa
          retention-days: 30
