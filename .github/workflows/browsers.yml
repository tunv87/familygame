name: Browsers

# The QA suite in browsers other than desktop Chrome (qa/playwright.browsers.config.ts):
#  - mobile-safari / mobile-chrome: the UI and UX suites in full on phone and tablet sizes
#  - firefox-smoke / edge-smoke / safari-desktop-smoke: the BR smoke checks on a computer
# Screenshots of every checked screen are kept as the run's artifact.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: mobile-safari
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: firefox-smoke
            browser: firefox
          - project: edge-smoke
            browser: msedge
          - project: safari-desktop-smoke
            browser: webkit
    name: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: QA (${{ matrix.project }})
        env:
          QA_PROJECT: ${{ matrix.project }}
        run: >
          npx firebase emulators:exec --only auth,database --project demo-familygame
          "npx playwright test --config qa/playwright.browsers.config.ts --project=${{ matrix.project }} --trace off"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.project }}
          path: |
            qa/runs/tmp/artifacts-browsers
            qa/runs/tmp/e2e-browsers.json
            qa/evidence/screens-${{ matrix.project }}
          retention-days: 14
